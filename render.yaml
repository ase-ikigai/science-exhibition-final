services:
  # ── Backend (FastAPI + Python) ───────────────────────────────────────────
  - type: web
    name: ikigai-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MONGO_URL
        sync: false      # set in Render dashboard — your MongoDB Atlas URI
      - key: DB_NAME
        value: ikigai
      - key: CORS_ORIGINS
        sync: false      # set to your frontend URL after it deploys (e.g. https://my-frontend.onrender.com)
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false      # paste your Groq API key (https://console.groq.com)

  # ── Frontend (React static site) ─────────────────────────────────────────
  - type: web
    name: ikigai-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: yarn install --frozen-lockfile && yarn build
    staticPublishPath: build
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false      # set to your backend URL (e.g. https://ikigai-backend.onrender.com)
